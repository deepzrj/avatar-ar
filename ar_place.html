<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Avatar Splat – AR (plane detect + one-tap place)</title>

  <script type="importmap">{
    "imports":{
      "three":"./lib/three.module.js",
      "@mkkellogg/gaussian-splats-3d":"./lib/gaussian-splats-3d.module.js"
    }
  }</script>

  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#111;touch-action:none}
    #enter{position:fixed;left:12px;bottom:12px;padding:10px 14px;border:0;border-radius:10px;background:#0a84ff;color:#fff;font:600 14px system-ui}
    #log{position:fixed;top:8px;left:8px;color:#0f0;font:14px/1.4 system-ui;white-space:pre-wrap}
    canvas{display:block}
  </style>
</head>
<body>
<button id="enter">Enter AR</button>
<div id="log">loading…</div>

<script type="module">
import * as THREE from "three";
import * as G from "@mkkellogg/gaussian-splats-3d";

const log=(...a)=>{const e=document.getElementById('log');e.textContent+=(e.textContent?'\n':'')+a.join(' ')};

// --------- Config ---------
const MODEL = "./assets/data/Shakti-edit.ksplat";
const PLACE_OFFSET = 0.2; // meters in front of reticle/camera

// Helper: Euler (radians) -> quaternion array
const qFromEuler = (x=0,y=0,z=0)=>
  new THREE.Quaternion().setFromEuler(new THREE.Euler(x,y,z)).toArray();

// ORIENTATION: stand upright (was lying on the floor before)
// -90° around X stands the model up.
// If it faces the wrong way, try ROT_STAND_YAW = qFromEuler(-Math.PI/2, Math.PI, 0)
const ROT_STAND = qFromEuler(Math.PI/2, Math.PI, 0);
// const ROT_STAND_YAW = qFromEuler(-Math.PI/2, Math.PI, 0); // optional 180° turn

// --------- Three.js scene ---------
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 50);
const renderer = new THREE.WebGLRenderer({alpha:true, antialias:true});
renderer.xr.enabled = true;
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// World-locked root we move with hit-test pose
const root = new THREE.Group();
scene.add(root);

// Reticle
const reticle = new THREE.Mesh(
  new THREE.RingGeometry(0.06, 0.085, 32).rotateX(-Math.PI/2),
  new THREE.MeshBasicMaterial({color:0xffffff})
);
reticle.matrixAutoUpdate = false;
reticle.visible = false;
scene.add(reticle);

// --------- Splat viewer (DropInViewer) ---------
let splat=null, session, refSpace, viewerSpace, hitSource;
let placed=false;

(async()=>{
  try{
    log("preloading model…");
    splat = new G.DropInViewer({
      sharedMemoryForWorkers:false,
      gpuAcceleratedSort:false,
      enableSIMDInSort:false
    });

    await splat.addSplatScenes([{
      path: MODEL,
      splatAlphaRemovalThreshold: 5,
      rotation: ROT_STAND      // << upright
      // rotation: ROT_STAND_YAW // use this line instead if it faces backward
    }]);

    splat.scale.set(0.2, 0.2, 0.2); // smaller
    splat.visible = false;
    root.add(splat);
    log("model preloaded ✔  tap Enter AR");
  }catch(e){ log("load ERROR:", e?.message||e); console.error(e); }
})();

// --------- Start AR ---------
document.getElementById('enter').addEventListener('click', startAR, {passive:true});

async function startAR(){
  if(!navigator.xr){ alert("WebXR not available"); return; }
  try{
    session = await navigator.xr.requestSession('immersive-ar',{
      requiredFeatures:['hit-test','local-floor'],
      optionalFeatures:['dom-overlay'], domOverlay:{root:document.body}
    });

    renderer.xr.setReferenceSpaceType('local-floor');
    await renderer.xr.setSession(session);

    refSpace    = await session.requestReferenceSpace('local-floor');
    viewerSpace = await session.requestReferenceSpace('viewer');
    hitSource   = await session.requestHitTestSource({space:viewerSpace});

    session.addEventListener('select', placeOnce);
    addEventListener('pointerup', placeOnce, {passive:true});
    addEventListener('touchend', placeOnce, {passive:true});

    document.getElementById('enter').remove();
    log("AR session started ✔  move phone to find a surface, then tap to place");
  }catch(e){ log("AR start ERROR:", e?.message||e); console.error(e); }
}

// --------- Place exactly once & push a bit farther ---------
function placeOnce(){
  if(!session || !splat || placed) return;
  if(reticle.visible){
    reticle.matrix.decompose(root.position, root.quaternion, root.scale);

    // push forward so you can walk around it immediately
    const forward = new THREE.Vector3(0,0,-1).applyQuaternion(root.quaternion);
    root.position.addScaledVector(forward, PLACE_OFFSET);

    splat.visible = true;
    placed = true;
    reticle.visible = false;
    log("placed ✔");

    session.removeEventListener('select', placeOnce);
    removeEventListener('pointerup', placeOnce);
    removeEventListener('touchend', placeOnce);
  }
}

// --------- Frame loop + hit-test ---------
renderer.setAnimationLoop((t, frame)=>{
  if(frame && hitSource && !placed){
    const hits = frame.getHitTestResults(hitSource);
    if(hits.length){
      const pose = hits[0].getPose(refSpace);
      reticle.visible = true;
      reticle.matrix.fromArray(pose.transform.matrix);
    } else {
      reticle.visible = false;
    }
  }
  splat?.update?.();
  renderer.render(scene, camera);
});

// --------- Resize ---------
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// quick HEAD check (helps debug 404s)
try{
  const r = await fetch(MODEL,{method:'HEAD'});
  log("model HEAD:", r.status);
}catch(e){ log("HEAD error:", e?.message||e); }
</script>
</body>
</html>
