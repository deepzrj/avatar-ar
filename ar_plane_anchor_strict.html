<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>AR — STRICT Anchored Cube + Plane Viz</title>
  <script type="importmap">{
    "imports": { "three":"./lib/three.module.js" }
  }</script>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#111;touch-action:none}
    #enter{position:fixed;left:12px;bottom:12px;padding:10px 14px;border:0;border-radius:10px;background:#0a84ff;color:#fff;font:600 14px system-ui}
    #log{position:fixed;top:8px;left:8px;color:#0f0;font:14px/1.4 system-ui;white-space:pre-wrap;max-width:86vw}
    canvas{display:block}
  </style>
</head>
<body>
<button id="enter">Enter AR</button>
<div id="log">loading…</div>

<script type="module">
import * as THREE from "three";
const log=(...a)=>{const e=document.getElementById('log');e.textContent+=(e.textContent?'\n':'')+a.join(' ')};

// --- Three.js scene ---
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 50);
const renderer = new THREE.WebGLRenderer({alpha:true, antialias:true});
renderer.xr.enabled = true;
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// World root that will be driven ONLY by anchor pose
const root = new THREE.Group();
scene.add(root);

// Test cube (0.25 m)
const cube = new THREE.Mesh(
  new THREE.BoxGeometry(0.25,0.25,0.25),
  new THREE.MeshNormalMaterial()
);
cube.visible = false;
root.add(cube);

// Reticle (shows hit-test pose pre-placement)
const reticle = new THREE.Mesh(
  new THREE.RingGeometry(0.06, 0.085, 32).rotateX(-Math.PI/2),
  new THREE.MeshBasicMaterial({color:0xffffff})
);
reticle.matrixAutoUpdate = false;
reticle.visible = false;
scene.add(reticle);

// Plane visualization (optional)
const planeViz = new Map(); // XRPlane -> {group,line}
function makePlaneGroup(){
  const g = new THREE.Group();
  const geom = new THREE.BufferGeometry();
  const line = new THREE.LineLoop(geom, new THREE.LineBasicMaterial({color:0x39ff14}));
  g.add(line);
  const dot = new THREE.Mesh(new THREE.CircleGeometry(0.01,16), new THREE.MeshBasicMaterial({color:0x39ff14}));
  dot.rotation.x = -Math.PI/2;
  g.add(dot);
  return {group:g, line};
}
function updatePoly(line, polygon){
  const verts = new Float32Array(polygon.length*3);
  for (let i=0;i<polygon.length;i++){ const p=polygon[i]; verts[i*3]=p.x; verts[i*3+1]=p.y; verts[i*3+2]=p.z; }
  line.geometry.setAttribute('position', new THREE.BufferAttribute(verts,3));
  line.geometry.computeBoundingSphere();
  line.geometry.attributes.position.needsUpdate = true;
}

// --- WebXR state ---
let session, refSpace, viewerSpace, hitSource;
let placed = false;
let anchor = null, anchorSpace = null;

// Start button
document.getElementById('enter').addEventListener('click', startAR, {passive:true});

async function startAR(){
  if(!navigator.xr){ alert('WebXR not available'); return; }

  // Strict: require anchors so object WILL stay put; plane-detection is optional (for viz).
  try{
    session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test','local-floor','anchors'],
      optionalFeatures: ['dom-overlay','plane-detection'],
      domOverlay: { root: document.body }
    });
  }catch(err){
    log('❌ Could not start AR with required anchors. This device/Chrome build may not support WebXR Anchors.');
    log('Error: ' + (err?.message || err));
    return;
  }

  renderer.xr.setReferenceSpaceType('local-floor');
  await renderer.xr.setSession(session);

  refSpace    = await session.requestReferenceSpace('local-floor');
  viewerSpace = await session.requestReferenceSpace('viewer');
  hitSource   = await session.requestHitTestSource({space:viewerSpace});

  session.addEventListener('select', placeOnce);
  addEventListener('pointerup', placeOnce, {passive:true});
  addEventListener('touchend', placeOnce, {passive:true});

  document.getElementById('enter').remove();
  log('AR started ✔  Move to find a surface, then tap to place');

  session.addEventListener('end', ()=>{
    planeViz.forEach(({group})=>scene.remove(group));
    planeViz.clear();
  });
}

async function placeOnce(){
  if(!session || placed) return;

  const frame = renderer.xr.getFrame?.(); if(!frame || !hitSource) return;

  const hits = frame.getHitTestResults(hitSource);
  if(!hits.length){ log('no hit yet'); return; }

  try{
    const hit = hits[0];

    // STRICT: create the anchor from the hit; if not possible, abort placement.
    if(!hit.createAnchor){
      log('❌ Runtime does not support createAnchor from hit result. Aborting (strict mode).');
      return;
    }
    anchor = await hit.createAnchor(refSpace);
    anchorSpace = anchor.anchorSpace;

    // Show cube; stop reticle
    cube.visible = true;
    placed = true;
    reticle.visible = false;
    log('placed with anchor ✔');

    session.removeEventListener('select', placeOnce);
    removeEventListener('pointerup', placeOnce);
    removeEventListener('touchend', placeOnce);
  }catch(e){
    log('❌ Anchor creation failed: ' + (e?.message || e));
  }
}

// Animation loop
renderer.setAnimationLoop((time, frame)=>{
  if(!frame){ renderer.render(scene, camera); return; }

  // Before placement: show reticle from hit-test
  if(hitSource && !placed){
    const hits = frame.getHitTestResults(hitSource);
    if(hits.length){
      const pose = hits[0].getPose(refSpace);
      if(pose){ reticle.visible = true; reticle.matrix.fromArray(pose.transform.matrix); }
    } else {
      reticle.visible = false;
    }
  }

  // After placement: drive root ONLY from anchorSpace (no other updates)
  if(placed && anchorSpace){
    const pose = frame.getPose(anchorSpace, refSpace);
    if(pose){
      const m = new THREE.Matrix4().fromArray(pose.transform.matrix);
      m.decompose(root.position, root.quaternion, root.scale);
    }
  }

  // Plane polygons (only if runtime exposes them)
  const planes = frame.worldInformation?.detectedPlanes;
  if(planes){
    for(const plane of planes){
      if(!planeViz.has(plane)){
        const {group,line} = makePlaneGroup();
        scene.add(group);
        planeViz.set(plane, {group,line});
        plane.addEventListener?.('removed', ()=>{
          const pv = planeViz.get(plane);
          if(pv){ scene.remove(pv.group); planeViz.delete(plane); }
        });
      }
      const pv = planeViz.get(plane);
      const pp = frame.getPose(plane.planeSpace, refSpace);
      if(pp){
        const m = new THREE.Matrix4().fromArray(pp.transform.matrix);
        m.decompose(pv.group.position, pv.group.quaternion, pv.group.scale);
      }
      if(plane.polygon && plane.polygon.length>=3){
        updatePoly(pv.line, plane.polygon);
      }
    }
    planeViz.forEach((pv, pl)=>{ if(!planes.has(pl)){ scene.remove(pv.group); planeViz.delete(pl); }});
  }

  renderer.render(scene, camera);
});

// Resize
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
