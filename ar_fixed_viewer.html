<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Splat – AR (viewer-driven, world-locked)</title>

  <script type="importmap">
  {
    "imports": {
      "three": "./lib/three.module.js",
      "@mkkellogg/gaussian-splats-3d": "./lib/gaussian-splats-3d.module.js"
    }
  }
  </script>

  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#111}
    /* removed #enter (no extra button now) */
    #log{position:fixed;top:8px;left:8px;color:#0f0;font:14px/1.4 system-ui,Arial;white-space:pre-wrap}
  </style>
</head>
<body>
<div id="log">loading…</div>

<script type="module">
import * as G from "@mkkellogg/gaussian-splats-3d";
const log=(...a)=>{const e=document.getElementById('log');e.textContent+=(e.textContent?'\n':'')+a.join(' ')};

const MODEL = "./assets/data/Shakti-edit.ksplat";

// Let the library own WebXR (keeps the splat world-locked)
const viewer = new G.Viewer({
  webXRMode: G.WebXRMode.AR,
  sharedMemoryForWorkers: false,
  gpuAcceleratedSort: false,
  enableSIMDInSort: false,
  cameraUp: [0,1,0],
  initialCameraPosition: [0,1.6,0],
  initialCameraLookAt: [0,1.2,-1]
});

// Put the model close and big so it's easy to see
await viewer.addSplatScene(MODEL, {
  showLoadingUI: true,
  position: [0, 0, -1.2],          // distance straight ahead
  scale: [1.2, 1.2, 1.2],          // size
  splatAlphaRemovalThreshold: 5
});

// Start the viewer immediately; use the built-in grey "START AR" button
(async () => {
  await viewer.start();
  log("viewer started ✔  tap the grey START AR button");
})();

// quick HEAD check
try {
  const r = await fetch(MODEL, {method:"HEAD"});
  log("model:", r.status);
} catch (e) {
  log("model error:", e?.message || e);
}
</script>
</body>
</html>
