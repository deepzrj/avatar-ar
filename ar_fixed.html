<!doctype html><html><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Splat – AR (world-locked)</title>
<script type="importmap">{"imports":{
  "three":"./lib/three.module.js",
  "@mkkellogg/gaussian-splats-3d":"./lib/gaussian-splats-3d.module.js"
}}</script>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#111}
#enter{position:fixed;left:12px;bottom:12px;padding:10px 14px;border:0;border-radius:8px;background:#0a84ff;color:#fff;font:600 14px system-ui}
#log{position:fixed;top:8px;left:8px;color:#0f0;font:14px/1.4 system-ui;white-space:pre-wrap}</style>
</head><body>
<button id="enter">Enter AR</button><div id="log">loading…</div>
<script type="module">
import * as THREE from "three";
import * as G from "@mkkellogg/gaussian-splats-3d";
const log=(...a)=>{const e=document.getElementById('log');e.textContent+=(e.textContent?'\n':'')+a.join(' ')};

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.01,50);
const renderer=new THREE.WebGLRenderer({alpha:true});renderer.xr.enabled=true;
renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);

const root=new THREE.Group();scene.add(root);

const MODEL="./assets/data/Shakti-edit.ksplat";
let splat=null;

document.getElementById('enter').addEventListener('click', async()=>{
  try{
    const session=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['local-floor']});
    renderer.xr.setReferenceSpaceType('local-floor'); await renderer.xr.setSession(session);
    log('AR session ✔  loading model…');

    splat=new G.DropInViewer({sharedMemoryForWorkers:false,gpuAcceleratedSort:false,enableSIMDInSort:false});
    await splat.addSplatScenes([{path:MODEL,showLoadingUI:true,splatAlphaRemovalThreshold:5}]);
    splat.scale.set(0.6,0.6,0.6);
    root.add(splat);

    // pin at a fixed pose ~2m forward
    root.position.set(0,0,-2.0); root.rotation.set(0,0,0);
    document.getElementById('enter').remove();
  }catch(e){log('ERROR:', e.message||e)}
});
renderer.setAnimationLoop(()=>renderer.render(scene,camera));
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
try{const r=await fetch(MODEL,{method:'HEAD'});log('model:',r.status);}catch(e){log('model err:',e.message||e)}
</script></body></html>
